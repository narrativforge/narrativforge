<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="nbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="50%" stop-color="#180a33"/>
      <stop offset="100%" stop-color="#05020d"/>
    </linearGradient>
    <radialGradient id="nbeam" cx="25%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="naccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="nglow"><feGaussianBlur stdDeviation="8" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="filmstrip" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect x="5" y="2" width="30" height="16" rx="3" fill="#1e1035" stroke="#3b1d6b" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Canvas Base -->
  <rect width="1500" height="500" fill="url(#nbg)"/>
  <rect width="1500" height="500" fill="url(#nbeam)"/>

  <!-- 35mm Film Strip Accents Top & Bottom -->
  <rect x="0" y="0" width="1500" height="24" fill="#0c061a"/>
  <rect x="0" y="2" width="1500" height="20" fill="url(#filmstrip)"/>
  <rect x="0" y="476" width="1500" height="24" fill="#0c061a"/>
  <rect x="0" y="478" width="1500" height="20" fill="url(#filmstrip)"/>

  <!-- Cinematic Grid / Light Rays -->
  <g opacity="0.25">
    <line x1="0" y1="250" x2="1500" y2="250" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="8 8"/>
    <line x1="320" y1="24" x2="320" y2="476" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="1200" y1="24" x2="1200" y2="476" stroke="#ec4899" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Left: Holographic Camera Aperture & Audio Waveforms -->
  <g transform="translate(180, 250)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#3b1d6b" stroke-width="2"/>
    <circle cx="0" cy="0" r="125" fill="#130926" stroke="#8b5cf6" stroke-width="3" filter="url(#nglow)"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="12 6"/>
    <!-- Shutter Blades -->
    <path d="M 0,-110 L 45,-20 L -30,-40 Z" fill="#8b5cf6" opacity="0.4"/>
    <path d="M 110,0 L 20,45 L 40,-30 Z" fill="#ec4899" opacity="0.4"/>
    <path d="M 0,110 L -45,20 L 30,40 Z" fill="#06b6d4" opacity="0.4"/>
    <path d="M -110,0 L -20,-45 L -40,30 Z" fill="#8b5cf6" opacity="0.4"/>
    <!-- Center Play/Lens -->
    <circle cx="0" cy="0" r="48" fill="#0c051a" stroke="url(#naccent)" stroke-width="4"/>
    <polygon points="-12,-22 24,0 -12,22" fill="#ffffff" filter="url(#nglow)"/>
  </g>

  <!-- Audio Waveform Visualizer on Right -->
  <g transform="translate(1080, 200)" opacity="0.75">
    <rect x="0" y="20" width="8" height="60" rx="4" fill="#8b5cf6"/>
    <rect x="18" y="0" width="8" height="100" rx="4" fill="#ec4899"/>
    <rect x="36" y="35" width="8" height="30" rx="4" fill="#06b6d4"/>
    <rect x="54" y="10" width="8" height="80" rx="4" fill="#8b5cf6"/>
    <rect x="72" y="25" width="8" height="50" rx="4" fill="#ec4899"/>
    <rect x="90" y="40" width="8" height="20" rx="4" fill="#06b6d4"/>
    <rect x="108" y="5" width="8" height="90" rx="4" fill="#8b5cf6"/>
    <rect x="126" y="28" width="8" height="44" rx="4" fill="#ec4899"/>
    <rect x="144" y="15" width="8" height="70" rx="4" fill="#06b6d4"/>
    <rect x="162" y="32" width="8" height="36" rx="4" fill="#8b5cf6"/>
  </g>

  <!-- Typography & Badges -->
  <g transform="translate(380, 160)">
    <!-- Badge -->
    <rect x="0" y="0" width="230" height="30" rx="15" fill="#241047" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="16" cy="15" r="5" fill="#ec4899"/>
    <text x="32" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a78bfa" letter-spacing="2">CINEMATIC AI STUDIO</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Segoe UI', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="4">NARRATIV FORGE</text>
    
    <!-- Accent Line -->
    <rect x="0" y="105" width="620" height="4" rx="2" fill="url(#naccent)"/>

    <!-- Tagline -->
    <text x="0" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1" letter-spacing="1">AI-Powered Multimedia Studio for Visual &amp; Audio Production</text>
    
    <!-- Sub-pills -->
    <g transform="translate(0, 185)" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1b0e36" stroke="#4c1d95" stroke-width="1"/>
      <text x="65" y="18" fill="#e9d5ff" text-anchor="middle">STORY ENGINE</text>
      <rect x="145" y="0" width="140" height="28" rx="6" fill="#1b0e36" stroke="#4c1d95" stroke-width="1"/>
      <text x="215" y="18" fill="#e9d5ff" text-anchor="middle">AUDIO SYNTHESIS</text>
      <rect x="300" y="0" width="140" height="28" rx="6" fill="#1b0e36" stroke="#4c1d95" stroke-width="1"/>
      <text x="370" y="18" fill="#e9d5ff" text-anchor="middle">VIDEO GENESIS</text>
      <rect x="455" y="0" width="165" height="28" rx="6" fill="#1b0e36" stroke="#4c1d95" stroke-width="1"/>
      <text x="537" y="18" fill="#e9d5ff" text-anchor="middle">MEDIA AUTOMATION</text>
    </g>
  </g>
</svg>